# UML Generation Pipeline — Dipak Yadav
# https://github.com/dipak5501/uml-generation-pipeline
#
# Structural defaults only. Runtime provider/model paths live in .env
# (see .env.example). Production: Math dept Mac Studio M1 Ultra (24/7 LaunchAgents),
# dual Ollama :11434/:11435, MLX LoRA sourcecode-30k, local Aya-Vision-8B.
# Architecture: docs/SYSTEM_DESIGN.md

author:
  name: Dipak Yadav
  github: dipak5501

# Application DB, artifacts, training corpora (gitignored)
data_dir: data
output_dir: output

# VLM weights from MMMU benchmark scores (paper Eq.; mirrored in app/settings.py)
# Production routes: qwen→Ollama:11435, llama-vision→Ollama:11434, aya→local Transformers
vlm_weights:
  qwen25vl3b: 53.1
  llama32vl11b: 50.7
  aya_vision_8b: 39.9

# Hugging Face open sources for corpus builders (8k / 50k / 100k — see models/README.md)
datasets:
  class:
    repo: nguyenvanviet/UMLCode-ClassDiagram-DeepSeek-32B-Reasoning-RAW
    diagram_type: class
  object:
    repo: nguyenvanviet/UMLCode_ObjectDiagram_Scored
    diagram_type: object
  component:
    repo: nguyenvanviet/UMLCode_ComponentDiagram_Scored
    diagram_type: component
  package:
    repo: nguyenvanviet/UMLCode_PackageDiagram_Scored
    diagram_type: package
  # Gated (needs HF_TOKEN + license accept) — optional scored class set
  class_scored_gated:
    repo: nguyenvanviet/UMLCode-ClassDiagram-DeepSeek-32B-Scored
    diagram_type: class

diagram_types:
  - class
  - object
  - component
  - package
  - flowchart

generation:
  samples_per_type: 2000
  temperature_spec: 0.8
  temperature_code: 0.2

plantuml:
  jar_path: tools/plantuml.jar
  image_format: png
