name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "import uml_pipeline; print(uml_pipeline.__author__, uml_pipeline.__version__)"

      - name: Validate config
        run: python -c "from uml_pipeline.config import load_config; c=load_config(); assert c['author']['name']=='Dipak Yadav'"
