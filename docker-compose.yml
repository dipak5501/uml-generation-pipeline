services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOCK_PROVIDERS: "true"
      DATABASE_URL: sqlite:////app/data/uml_app.db
      API_BASE_URL: http://api:8000
    volumes:
      - uml_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      MOCK_PROVIDERS: "true"
    depends_on:
      - api
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  uml_data:
