[theme]
primaryColor = "#0f766e"
backgroundColor = "#f3efe6"
secondaryBackgroundColor = "#ebe4d6"
textColor = "#14212b"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
